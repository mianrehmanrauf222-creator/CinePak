<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>CinePak — Your World of Movies</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // Redirects 404 paths back into the SPA hash route
      var pathSegmentsToKeep = 1; // for /CinePak/
      var l = window.location;
      var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var search = l.search ? l.search : '';
      var hash = path ? '#' + path : (l.hash || '');
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/' + l.pathname.slice(1).split('/').slice(0, pathSegmentsToKeep).join('/') + '/' +
        (search || '') +
        hash
      );
    </script>
  </head>
  <body style="background-color: #08080a; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <h2 style="color: #f59e0b; margin-bottom: 8px;">CinePak Streaming</h2>
      <p style="color: #9ca3af; font-size: 14px;">Redirecting to your movie...</p>
    </div>
  </body>
</html>
